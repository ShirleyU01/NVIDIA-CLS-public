  <body>
    <div id="root"></div>
    <script>
      (function () {
        var rest = sessionStorage.getItem('socrates-spa-redirect')
        if (!rest) return
        sessionStorage.removeItem('socrates-spa-redirect')
        if (rest.charAt(0) !== '/') rest = '/' + rest
        var base = '/NVIDIA-CLS-public/app/'.replace(/\/$/, '')
        if (!base || base === '/NVIDIA-CLS-public/app/' || base === '/') base = ''
        history.replaceState(null, '', base + rest)
      })()
